# Edge TLS termination for api.aurorapay.example.
#
# Two server blocks on purpose: the merchant API accepts modern clients only,
# and the partner interface still has to accept the acquirer's 2016-vintage
# Java client, which negotiates nothing newer than TLS 1.2 and needs a CBC
# suite in the list.

upstream aurora_api {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name api.aurorapay.example;

    ssl_certificate     /etc/ssl/aurora/api.crt;
    ssl_certificate_key /etc/ssl/aurora/api.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve X25519:secp384r1;

    ssl_session_cache shared:AuroraTLS:20m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://aurora_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /v1/webhooks {
        client_max_body_size 1m;
        proxy_pass http://aurora_api;
        proxy_set_header Host $host;
    }
}

# Partner interface. Kept separate so the weaker suite list below cannot be
# negotiated by anything reaching the merchant API above.
server {
    listen 8443 ssl;
    server_name partners.aurorapay.example;

    ssl_certificate     /etc/ssl/aurora/partners.crt;
    ssl_certificate_key /etc/ssl/aurora/partners.key;

    # mTLS: partners present a certificate we pinned at onboarding.
    ssl_client_certificate /etc/ssl/aurora/partner-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    ssl_protocols TLSv1.2;
    # AES128-SHA is here for the acquirer's legacy client only. Tracked as
    # PLAT-4390; it comes out when they finish their 2027 upgrade.
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:AES128-SHA:DES-CBC3-SHA;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve prime256v1;

    location / {
        proxy_pass http://aurora_api;
        proxy_set_header X-Partner-DN $ssl_client_s_dn;
        proxy_set_header X-Partner-Serial $ssl_client_serial;
    }
}
