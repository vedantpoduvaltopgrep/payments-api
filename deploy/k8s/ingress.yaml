apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aurora-payments-api
  namespace: aurora
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
spec:
  tls:
    - hosts:
        - api.aurorapay.example
      secretName: aurora-api-tls
  rules:
    - host: api.aurorapay.example
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: aurora-payments-api
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aurora-partners
  namespace: aurora
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: "aurora/partner-ca"
    # The acquirer's client cannot negotiate TLS 1.3. Removed when PLAT-4390
    # closes.
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:DES-CBC3-SHA"
spec:
  tls:
    - hosts:
        - partners.aurorapay.example
      secretName: aurora-partners-tls
  rules:
    - host: partners.aurorapay.example
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: aurora-payments-api
                port:
                  number: 8080
